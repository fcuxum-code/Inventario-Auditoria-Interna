/* Modo de color guardado: se aplica antes de dibujar para que no haya parpadeo.
   Si no hay elección guardada, no se pone atributo y manda la preferencia del sistema. */
(function(){ try{ var t=localStorage.getItem('inv_ai_tema'); if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t); }catch(e){} })();
</script>
<script src="js/icons.js?v=49"></script>
<link rel="stylesheet" href="css/styles.css?v=49">
<!-- Tipografía Inter: se pide sin bloquear el dibujado (media="print" y al cargar pasa a "all").
     Así la app aparece de inmediato con la letra del sistema y cambia a Inter cuando llega;
     si no hay señal, simplemente se queda con la del sistema en vez de dejar la pantalla en blanco. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<body>

<div class="migoverlay" id="migoverlay" style="display:none"><div class="spin"></div><div id="migtxt">Conectando…</div></div>
<div class="migoverlay" id="loginoverlay" style="display:none">
  <div style="font-size:40px;margin-bottom:8px">🔒</div>
  <div style="font-size:17px;font-weight:800;margin-bottom:18px">Inventario Físico — Auditoría Interna</div>
  <div style="width:100%;max-width:320px">
    <input id="li_email" type="email" placeholder="Correo" style="width:100%;padding:13px;border-radius:10px;border:none;font-size:16px;margin-bottom:10px;box-sizing:border-box" autocomplete="username">
    <input id="li_pass" type="password" placeholder="Contraseña" style="width:100%;padding:13px;border-radius:10px;border:none;font-size:16px;margin-bottom:14px;box-sizing:border-box" autocomplete="current-password" onkeydown="if(event.key==='Enter'){doLogin();}">
    <button id="li_btn" onclick="doLogin()" style="width:100%;padding:14px;border-radius:10px;border:none;background:#57c95f;color:#fff;font-weight:700;font-size:15px">Iniciar sesión</button>
    <div id="li_err" style="color:#FFC2C2;font-size:12.5px;margin-top:10px;min-height:16px"></div>
  </div>
</div>

<header>
  <div class="hrow">
    <div class="htitle">Inventario Físico<small><span class="syncdot" id="syncdot"></span><span class="synctxt" id="synctxt">Conectando…</span><span id="rolDot" class="rolbadge" style="display:none">Solo lectura</span></small></div>
    <button class="hbtn" id="menubtn" onclick="openMenu()" aria-label="Menú"></button>
  </div>
  <div class="pbarwrap"><div class="pbar" id="pbar"></div><div class="pbartxt" id="pbartxt">0 / 0</div></div>
</header>

<div class="searchbar">
  <span class="searchic" id="searchic"></span>
  <input id="search" type="search" inputmode="search" placeholder="Buscar por nombre, No. o descripción…"
    oninput="onSearch(this.value)" autocomplete="off">
  <button class="filterbtn" id="filterbtn" onclick="toggleFiltrosBusqueda()" aria-label="Filtros"></button>
</div>

<div id="view" class="wrap"></div>

<div id="printArea"></div>

<div class="fabbar" id="fabbar">
  <button class="fb-home" id="fbhome" onclick="goHome()"></button>
  <button class="fb-hz" id="fbses" style="background:#1F3864;color:#fff" onclick="newSession()"></button>
  <button class="fb-exp" id="fbhall" style="background:#B5651D" onclick="newHallazgo()"></button>
</div>
<script>
  document.getElementById('menubtn').innerHTML = icon('menu',20);
  document.getElementById('searchic').innerHTML = icon('search',17);
  document.getElementById('filterbtn').innerHTML = icon('sliders',16);
  document.getElementById('fbhome').innerHTML = icon('users',20)+'<span>Responsables</span>';
  document.getElementById('fbses').innerHTML = icon('clipboardCheck',20)+'<span>Nueva toma</span>';
  document.getElementById('fbhall').innerHTML = icon('plusCircle',20)+'<span>Hallazgo</span>';
</script>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<div class="pmodal" id="pmodal">
  <img id="pmimg" alt="foto">
  <div class="prow2">
    <button class="pm-rep" onclick="retakePhoto()">📷 Repetir</button>
    <button class="pm-del" onclick="deletePhoto()">🗑️ Eliminar</button>
    <button class="pm-cls" onclick="closePhoto()">Cerrar</button>
  </div>
</div>

<input type="file" id="camin" accept="image/*" capture="environment" hidden>
<input type="file" id="excelin" accept=".xlsx,.xls,.csv" hidden>

<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>

</body>
