name: Mascota APK

on:
  push:
    branches: [claude/mobile-pet-assistant-x60bn7]
    paths: ['mascota-perro/**', '.github/workflows/mascota-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mascota-perro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk mascota-perro-beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mascota-perro-beta
          path: mascota-perro/mascota-perro-beta.apk
      - name: Publicar beta descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mascota-beta
          target_commitish: ${{ github.sha }}
          name: Mascota (beta)
          prerelease: true
          make_latest: false
          files: mascota-perro/mascota-perro-beta.apk
          body: |
            APK de prueba de la mascota. Descárgalo desde el teléfono Android e instálalo
            (Android pedirá permitir instalar apps de esta fuente). Commit: ${{ github.sha }}
