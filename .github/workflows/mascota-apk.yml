name: Mascota APK

on:
  push:
    branches: [claude/mobile-pet-assistant-x60bn7]
    paths: ['mascota-perro/**', '.github/workflows/mascota-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mascota-perro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Caché de dependencias
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-mascota-${{ hashFiles('mascota-perro/**/*.gradle.kts') }}
          restore-keys: gradle-mascota-
      - name: Preparar Gradle 8.14.3 (con reintentos)
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsSL --retry 3 -o /tmp/gradle.zip https://downloads.gradle.org/distributions/gradle-8.14.3-bin.zip && break
            curl -fsSL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip && break
            echo "reintento $i"; sleep 20
          done
          if [ -s /tmp/gradle.zip ]; then
            unzip -q /tmp/gradle.zip -d /tmp && echo "/tmp/gradle-8.14.3/bin" >> "$GITHUB_PATH"
          else
            echo "::warning::No se pudo descargar Gradle; se usará el del runner"
          fi
      - name: Compilar APK
        run: |
          gradle --version
          for i in 1 2 3 4; do
            gradle assembleDebug --no-daemon --stacktrace && exit 0
            echo "Reintento de compilación $i (puede ser un fallo temporal de red)"; sleep 30
          done
          exit 1
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk mascota-perro-beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mascota-perro-beta
          path: mascota-perro/mascota-perro-beta.apk
      - name: Publicar beta descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mascota-beta
          target_commitish: ${{ github.sha }}
          name: Mangobeja (beta)
          prerelease: true
          make_latest: false
          files: mascota-perro/mascota-perro-beta.apk
          body: |
            APK de prueba de Mangobeja. Descárgalo desde el teléfono Android e instálalo
            (Android pedirá permitir instalar apps de esta fuente). Commit: ${{ github.sha }}

  prueba-emulador:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mascota-perro-beta
          path: mascota-perro
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar en Android virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mascota-perro/ci/prueba-emulador.sh
      - name: Hoja de capturas
        run: |
          cd capturas
          ls -la
          ls -la
      - name: Publicar capturas de la prueba
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mascota-pruebas
          target_commitish: ${{ github.sha }}
          name: Mangobeja (capturas de prueba automática)
          prerelease: true
          make_latest: false
          files: |
            capturas/*.png
            capturas/logcat.txt
          body: Capturas tomadas en un Android virtual para verificar que la mascota se mueve y juega. Commit ${{ github.sha }}
